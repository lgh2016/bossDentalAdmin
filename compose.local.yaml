name: bossdental-local
services:
  mongo:
    image: mongo:8
    container_name: bossdental-mongo
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - bossdental_mongo_data:/data/db
    tmpfs:
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  bossdental_mongo_data:
    name: bossdental_mongo_data
